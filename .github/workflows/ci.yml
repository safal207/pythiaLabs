name: CI
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          elixir-version: '1.16'
          otp-version: '26'

      - name: Run Lotus docs contract without Mix project evaluation
        run: elixir -e 'ExUnit.start()' test/lotus_docs_contract_test.exs --

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache deps
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}

      - name: Deps & compile
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get
          mix compile

      - name: Check Elixir formatting
        run: |
          mix format --check-formatted

      - name: Run Elixir tests
        run: |
          mix test

      - name: Run demo
        run: |
          mix run examples/lev_demo.exs

      - name: Run paid review demo (make demo)
        run: |
          make demo

      - name: Run bench
        run: |
          mix run benches/bench.exs

      - name: Build port worker
        run: |
          cd workers/solver_port && cargo build --release

      - name: Run worker tests
        run: |
          cd workers/solver_port && cargo test

      - name: Run port demo
        run: |
          mix run examples/port_demo.exs
