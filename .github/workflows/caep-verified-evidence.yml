name: CAEP Verified Evidence

on:
  pull_request:
    paths:
      - "protocols/caep/**"
      - ".github/workflows/caep-verified-evidence.yml"
  push:
    branches: [main]
    paths:
      - "protocols/caep/**"
      - ".github/workflows/caep-verified-evidence.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: protocols/caep/requirements-crypto.txt
      - name: Install crypto verifier dependency
        run: python -m pip install -r protocols/caep/requirements-crypto.txt
      - name: Run CAEP tests
        run: python -m unittest discover -s protocols/caep/tests -v
